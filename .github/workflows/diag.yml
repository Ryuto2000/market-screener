name: diag
on:
  workflow_dispatch:
    inputs:
      script:
        default: diag_sources.py
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p data/logs && python tools/${{ inputs.script }} 2>&1 | tee data/logs/diag.log
      - if: always()
        run: |
          git config user.name "screener-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/logs; git commit -m "diag log" || true; git pull --rebase; git push
