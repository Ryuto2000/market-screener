name: screen

on:
  schedule:
    - cron: "35 6 * * 1-5"   # JP: 15:35 JST (after the 15:30 close)
    - cron: "15 22 * * 1-5"  # US: after the close in both summer and winter time
  workflow_dispatch:
    inputs:
      market:
        description: "jp or us"
        required: true
        default: "jp"

permissions:
  contents: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick market
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 6 * * 1-5" ]; then
            echo "market=jp" >> "$GITHUB_OUTPUT"
          else
            echo "market=us" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pytest -q tests
      - name: Screen
        run: |
          mkdir -p data/logs
          set -o pipefail
          python -m screener.run --market ${{ steps.m.outputs.market }} 2>&1 | tee data/logs/${{ steps.m.outputs.market }}.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          # keep this run's outputs, then commit them on top of the latest main (another run may have pushed)
          files=$(git status --porcelain --untracked-files=all data | awk '{print $NF}')
          [ -n "$files" ] && tar cf /tmp/out.tar $files
          git fetch origin main
          git reset --hard origin/main
          [ -f /tmp/out.tar ] && tar xf /tmp/out.tar
          git add data
          git commit -m "data: ${{ steps.m.outputs.market }} $(date -u +%F)" || echo "no changes"
          git push origin HEAD:main
